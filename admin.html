<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de turnos</title>
<meta name="theme-color" content="#128c7e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Dra Julieta - Panel">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#6b7686; --accent:#128c7e; --danger:#c0392b; --border:#dde2e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161b; --card:#1b2129; --text:#e8ecf1; --muted:#97a3b3; --border:#2d3643; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 16px; font-size: 1.5rem; }
  .aviso { background: #fff3cd; color: #7a5b00; border: 1px solid #d4a017; padding: 10px 12px; border-radius: 8px; font-weight: 600; margin-bottom: 12px; }
  @media (prefers-color-scheme: dark) { .aviso { background: #3a2f07; color: #ffe08a; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card.cancelado { opacity: .55; }
  label { display:block; font-size:.9rem; margin: 10px 0 4px; }
  input, select { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--text); font:inherit; }
  button { border:1px solid var(--border); background:transparent; color:var(--text); padding:8px 12px; border-radius:8px; cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); border-color:var(--danger); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button { font-size:.9rem; padding:6px 12px; }
  .tabs button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  #entrar { display:inline-flex; align-items:center; gap:8px; }
  #entrar svg { flex:none; }
  .sesion { display:flex; align-items:center; gap:8px; }
  .sesion img { width:28px; height:28px; border-radius:50%; border:1px solid var(--border); object-fit:cover; }
  .sesion span { font-size:.9rem; color:var(--muted); }
  .resumen { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .resumen span { background:var(--card); border:1px solid var(--border); border-radius:999px; padding:4px 12px; font-size:.85rem; color:var(--muted); }
  .dia { font-weight:600; font-size:.95rem; color:var(--muted); margin:18px 0 6px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
  .fila { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:baseline; }
  .cuando { font-weight:600; }
  .estado { font-size:.8rem; padding:2px 8px; border-radius:999px; border:1px solid var(--border); }
  .estado.Pendiente { border-color:#d4a017; color:#d4a017; }
  .estado.Confirmado { border-color:var(--accent); color:var(--accent); }
  .estado.Cancelado { border-color:var(--danger); color:var(--danger); }
  .estado.Libre { border-color:var(--muted); color:var(--muted); }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .menuVistas { display:flex; gap:8px; margin-bottom:12px; }
  .menuVistas button { flex:1; padding:12px 8px; font-size:1rem; font-weight:600; border-radius:12px; }
  .menuVistas button.activa { background:var(--accent); border-color:var(--accent); color:#fff; }
  .ok { color:var(--accent); font-size:.9rem; margin-top:8px; min-height:1.2em; }
  #vistaCrear .campos { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #vistaCrear .campos input { width:auto; flex:1; min-width:130px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .error { color:var(--danger); font-size:.9rem; margin-top:8px; min-height:1.2em; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Panel de la Dra. Julieta</h1>

  <div id="login" class="card">
    <p class="muted">Acceso reservado a la doctora. Se entra con la cuenta de Google autorizada.</p>
    <button class="primary" id="entrar">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Entrar con Google
    </button>
    <p class="error" id="loginError"></p>
  </div>

  <div id="panel" hidden>
    <div class="top">
      <button id="volver">← Volver</button>
      <div class="sesion" id="sesion">
        <img id="avatar" alt="Foto de la cuenta">
        <span id="quien"></span>
        <button id="salir">Salir</button>
      </div>
    </div>

    <div class="menuVistas">
      <button id="verTurnos" class="activa">🗓 Tus turnos</button>
      <button id="verCrear">➕ Crear turnos</button>
    </div>

    <section id="vistaTurnos">
      <div class="resumen" id="resumen"></div>
      <p class="error" id="panelError"></p>
      <div id="lista"></div>
    </section>

    <section id="vistaCrear" hidden>
      <div class="card">
        <label for="nuevaFecha">Elegí el día y la hora del turno nuevo</label>
        <div class="campos">
          <input id="nuevaFecha" type="date" aria-label="Día del turno">
          <input id="nuevaHora" type="time" aria-label="Hora del turno">
          <button class="primary" id="crear">Agregar turno</button>
        </div>
        <p class="ok" id="crearOk"></p>
        <p class="error" id="crearError"></p>
      </div>
      <p class="muted">El turno nuevo queda "Libre" en Tus turnos y aparece al toque en el formulario público, listo para que lo reserve una paciente.</p>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, collection, doc, query, onSnapshot, updateDoc, writeBatch, addDoc }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, inMemoryPersistence, onAuthStateChanged, setPersistence, signInWithPopup, signOut }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { firebaseConfig, lugar } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
// "Siempre cerrada": la sesión vive solo en memoria. Al cerrar o recargar la
// página el panel vuelve al login y hay que entrar de nuevo (un solo toque).
setPersistence(auth, inMemoryPersistence).catch(() => {});
const $ = id => document.getElementById(id);

let turnos = [];
let dejarDeEscuchar = null;

/* ---------- Login con Google ----------
   Se entra con una cuenta de Google de la lista AUTORIZADAS. Se fuerza el
   selector de cuenta para no heredar una sesión equivocada del navegador.
   La seguridad real está en firestore.rules (esAdmin()): esta lista es solo
   para dar una respuesta amable; si alguien no autorizado igual abriera el
   panel, Firestore le niega toda escritura. */
const AUTORIZADAS = ["rominadehesa@gmail.com", "fornillojulieta3@gmail.com"];

async function entrar() {
  $("entrar").disabled = true;
  $("loginError").textContent = "";
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    const cred = await signInWithPopup(auth, provider);
    if (!AUTORIZADAS.includes(cred.user.email ?? "")) {
      // Cuenta válida de Google pero no aceptada: se cierra la sesión al toque.
      await signOut(auth);
      $("loginError").textContent = `"${cred.user.email}" no está autorizada para usar este panel.`;
      return;
    }
    // Si se logra, la pantalla la cambia onAuthStateChanged; acá no falta nada.
  } catch (e) {
    // Mensaje legible según el código; se agrega el código real para diagnóstico.
    const leyenda = {
      "auth/popup-closed-by-user": "Cerraste la ventana de Google antes de terminar.",
      "auth/cancelled-popup-request": "Se canceló la ventana de Google. Probá de nuevo.",
      "auth/popup-blocked": "El navegador bloqueó la ventana. Permití los pop-ups para este sitio.",
      "auth/popup-request-failed": "El navegador rechazó abrir la ventana. Probá en otra pestaña normal.",
      "auth/account-exists-with-different-credential": "Ese email ya está vinculado a otro método de acceso.",
      "auth/network-request-failed": "Fallo de red: no se pudo conectar con Google/Firebase.",
      "auth/operation-not-allowed": "El login con Google no está habilitado en la consola de Firebase.",
      "auth/unauthorized-domain": "Este dominio no está en Authentication → Settings → Authorized domains.",
    }[e?.code] || "No se pudo iniciar sesión con Google.";
    console.error("[login]", e);
    $("loginError").textContent = `${leyenda} (código: ${e?.code ?? "desconocido"})`;
  } finally {
    $("entrar").disabled = false;   // si entró, el panel ya está visible y esto no molesta
  }
}
$("entrar").onclick = entrar;
$("salir").onclick = () => signOut(auth);

/* ---------- Escucha de turnos (todo el acceso de lectura del panel está acá) ---------- */
function escucharTurnos() {
  // Escucha en tiempo real: si entra una reserva nueva, aparece sola.
  // Sin orderBy en la consulta: Firestore descartaría los docs cargados a mano
  // que falte fecha u hora. El orden se hace en render(), que sí los tolera.
  dejarDeEscuchar = onSnapshot(
    query(collection(db, "turnos")),
    snap => {
      $("panelError").textContent = "";
      turnos = snap.docs.map(d => normalizar({ id: d.id, ...d.data() }));
      render();
    },
    () => { $("panelError").textContent = "No se pudieron leer los turnos (¿reglas vencidas o bloqueadas?). Recargá la página."; }
  );
}
function pararEscucha() {
  if (dejarDeEscuchar) { dejarDeEscuchar(); dejarDeEscuchar = null; }
}

// Según la sesión: logueada → panel; NO logueada → solo el login.
onAuthStateChanged(auth, user => {
  pararEscucha();
  $("login").hidden = !!user;
  $("panel").hidden = !user;
  if (user) {
    // Chip de sesión: foto y nombre de la cuenta de Google conectada.
    $("avatar").src = user.photoURL || "./icons/perfil.jpg";
    $("quien").textContent = user.displayName || user.email;
    ver("turnos");   // siempre arranca en "Tus turnos"
    escucharTurnos();
  } else { turnos = []; render(); }
});

/* ---------- Vistas del panel (Tus turnos / Crear turnos) ---------- */
function ver(v) {   // "turnos" o "crear"
  $("verTurnos").classList.toggle("activa", v === "turnos");
  $("verCrear").classList.toggle("activa", v === "crear");
  $("vistaTurnos").hidden = v !== "turnos";
  $("vistaCrear").hidden = v !== "crear";
  if (v === "turnos") render();
}
$("verTurnos").onclick = () => ver("turnos");
$("verCrear").onclick = () => { $("crearOk").textContent = ""; ver("crear"); };

/* ---------- Utilidades ---------- */
const esFechaIso = f => /^\d{4}-\d{2}-\d{2}$/.test(f);

// Acepta turnos cargados a mano con otros nombres de campo (celular) o sin estado.
function normalizar(t) {
  return {
    ...t,
    paciente: String(t.paciente ?? ""),
    telefono: String(t.telefono ?? t.celular ?? ""),   // celular puede venir como número
    fecha: String(t.fecha ?? ""),
    hora: String(t.hora ?? ""),
    estado: t.estado || "Pendiente",
  };
}

function fechaLarga(fecha) {
  // Si la fecha no está en formato AAAA-MM-DD (por ejemplo "Jueves 05 de Nov"), se muestra tal cual.
  if (!esFechaIso(fecha)) return fecha || "Sin fecha";
  const [y, m, d] = fecha.split("-").map(Number);
  const t = new Date(y, m - 1, d).toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function numeroWa(tel) {
  let n = String(tel || "").replace(/\D/g, "");
  if (n.length === 10) n = "549" + n;   // área + número sin código de país
  return n.length >= 11 ? n : "";
}

function urlWhatsApp(t, tipo) {
  const n = numeroWa(t.telefono);
  if (!n) return "";
  const cuando = `${fechaLarga(t.fecha).toLowerCase()} a las ${t.hora} hs`;
  const msg = tipo === "cancelar"
    ? `Hola ${t.paciente}, tuve que cancelar tu turno del ${cuando}. ¿Querés que lo reprogramemos? Disculpá las molestias.`
    : `Hola ${t.paciente}, te confirmo tu turno del ${cuando}. ${lugar}. ¡Te espero!`;
  return `https://wa.me/${n}?text=${encodeURIComponent(msg)}`;
}

/* ---------- Acciones ---------- */
async function confirmar(t) {
  const url = urlWhatsApp(t, "confirmar");
  if (url) window.open(url, "_blank", "noopener"); // se abre en el clic, antes de esperar a Firebase
  try { await updateDoc(doc(db, "turnos", t.id), { estado: "Confirmado" }); }
  catch (e) { $("panelError").textContent = "No se pudo confirmar. Probá de nuevo."; }
}

async function cancelar(t) {
  if (!confirm(`¿Cancelar el turno de ${t.paciente}? El horario va a quedar libre.`)) return;
  const url = urlWhatsApp(t, "cancelar");
  if (url) window.open(url, "_blank", "noopener");
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, "turnos", t.id), { estado: "Cancelado" });
    batch.delete(doc(db, "slots", t.id)); // libera el candado del horario (ID = doc de "turnos")
    await batch.commit();
  } catch (e) { $("panelError").textContent = "No se pudo cancelar. Probá de nuevo."; }
}

async function eliminar(t) {
  const msg = t.paciente
    ? `¿Eliminar definitivamente el registro de ${t.paciente}?`
    : `¿Eliminar el turno disponible del ${fechaLarga(t.fecha)} a las ${t.hora} hs?`;
  if (!confirm(msg)) return;
  try {
    const batch = writeBatch(db);
    batch.delete(doc(db, "turnos", t.id));
    batch.delete(doc(db, "slots", t.id)); // borra el candado si es que existía
    await batch.commit();
  } catch (e) { $("panelError").textContent = "No se pudo eliminar."; }
}

/* ---------- Crear turno disponible ---------- */
// Convierte la fecha elegida al formato de los docs cargados a mano: "Jueves 05 de Nov"
function fechaComoDoc(d) {
  const dia = d.toLocaleDateString("es-AR", { weekday: "long" });               // "jueves"
  const num = String(d.getDate()).padStart(2, "0");
  const mes = d.toLocaleDateString("es-AR", { month: "short" }).replace(".", "");  // "nov."
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  return `${cap(dia)} ${num} de ${cap(mes)}`;
}

$("crear").onclick = async () => {
  $("crearError").textContent = "";
  const fecha = $("nuevaFecha").value, hora = $("nuevaHora").value;
  if (!fecha || !hora) { $("crearError").textContent = "Elegí fecha y hora."; return; }
  const [y, m, d] = fecha.split("-").map(Number);
  const [hh, mm] = hora.split(":").map(Number);
  try {
    await addDoc(collection(db, "turnos"), {
      fecha: fechaComoDoc(new Date(y, m - 1, d)),
      hora: `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`,
    });
    $("nuevaHora").value = "";   // queda listo para cargar el siguiente horario
    //Feedback: se queda en el mismo formulario, útil para cargar varios seguidos.
    $("crearOk").textContent = "Turno agregado ✔ Ya está como Libre en Tus turnos.";
  } catch (e) {
    console.error(e);
    $("crearError").textContent = "No se pudo crear el turno (¿reglas publicadas?).";
  }
};

/* ---------- Vista ---------- */
// Un solo listado (sin filtros): turnos ordenados y agrupados por día.
// Arriba, un resumen con contadores: cúantos libres/pendientes/confirmados/cancelados.
function libre(t) { return !String(t.paciente ?? "").trim() && t.estado !== "Cancelado"; }

function render() {
  // Chips de resumen
  const libres = turnos.filter(libre).length;
  const pend = turnos.filter(t => t.paciente && t.estado === "Pendiente").length;
  const conf = turnos.filter(t => t.estado === "Confirmado").length;
  const canc = turnos.filter(t => t.estado === "Cancelado").length;
  const resumen = $("resumen");
  resumen.innerHTML = "";
  for (const [v, txt] of [[libres, "libres"], [pend, "pendientes"], [conf, "confirmados"], [canc, "cancelados"]]) {
    const chip = document.createElement("span");
    chip.textContent = `${v} ${txt}`;
    resumen.appendChild(chip);
  }

  const visibles = turnos
    .slice()
    .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));

  const lista = $("lista");
  lista.innerHTML = "";
  if (!visibles.length) {
    lista.appendChild(linea("No hay turnos cargados."));
    return;
  }

  // Encabezado por día: se repite cuando cambia la fecha entre cards seguidas.
  let diaPrevio = null;
  for (const t of visibles) {
    const dl = fechaLarga(t.fecha);
    if (dl !== diaPrevio) {
      diaPrevio = dl;
      const dia = document.createElement("div");
      dia.className = "dia";
      dia.textContent = dl;
      lista.appendChild(dia);
    }

    const card = document.createElement("div");
    card.className = "card" + (t.estado === "Cancelado" ? " cancelado" : "");

    const fila = document.createElement("div");
    fila.className = "fila";
    const cuando = document.createElement("span");
    cuando.className = "cuando";
    cuando.textContent = `${t.hora} hs`;
    const estado = document.createElement("span");
    estado.className = "estado " + (libre(t) ? "Libre" : t.estado);
    estado.textContent = libre(t) ? "Libre" : t.estado;
    fila.append(cuando, estado);
    card.appendChild(fila);

    const nombre = document.createElement("div");
    nombre.textContent = t.paciente;
    card.appendChild(nombre);
    if (t.telefono) card.appendChild(linea("WhatsApp: " + t.telefono));
    if (t.cobertura) card.appendChild(linea("Cobertura: " + t.cobertura));
    if (t.motivo) card.appendChild(linea("Motivo: " + t.motivo));

    const acciones = document.createElement("div");
    acciones.className = "acciones";
    if (t.paciente) {
      if (t.estado === "Pendiente") acciones.appendChild(boton(numeroWa(t.telefono) ? "Confirmar y avisar" : "Confirmar", "primary", () => confirmar(t)));
      if (t.estado === "Confirmado" && numeroWa(t.telefono)) acciones.appendChild(boton("Reenviar confirmación", "", () => window.open(urlWhatsApp(t, "confirmar"), "_blank", "noopener")));
      if (t.estado !== "Cancelado") acciones.appendChild(boton("Cancelar", "danger", () => cancelar(t)));
      else acciones.appendChild(boton("Eliminar registro", "danger", () => eliminar(t)));
    } else {
      // Turno disponible (cargado a mano o por error de carga): solo se puede eliminar.
      acciones.appendChild(boton("Eliminar turno", "danger", () => eliminar(t)));
    }
    card.appendChild(acciones);

    lista.appendChild(card);
  }
}

$("volver").onclick = () => window.location.href = "./";
function boton(texto, clase, onClick) {
  const b = document.createElement("button");
  b.textContent = texto;
  if (clase) b.className = clase;
  b.onclick = onClick;
  return b;
}

function linea(texto) {
  const p = document.createElement("div");
  p.className = "muted";
  p.textContent = texto;   // textContent: los datos del paciente nunca se interpretan como HTML
  return p;
}
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }
</script>
</body>
</html>
